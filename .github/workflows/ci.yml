name: Kova CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["BETA", "main", "CLOUDFLARE"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Sanitizers, Web UI & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install isolated Web UI smoke-test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test Web UI interactions, public share & Admin Console
        run: npm run test:webui

      - name: Verify embedded Web UI bundle, CSP hash, i18n & contrast
        run: node scripts/build_webui.mjs --check

      - name: Test Cloudflare Worker proxy behavior
        run: npm run test:worker

      - name: Test Cloudflare Pages proxy adapter
        run: npm run test:pages

      - name: Test experimental Cloudflare-native reader
        run: npm run test:cf-native

      - name: Test experimental Cloudflare UI
        run: npm run test:cf-ui

      - name: Test experimental Cloudflare Google Drive connector
        run: npm run test:cf-google-drive

      - name: Test experimental Cloudflare Dropbox connector
        run: npm run test:cf-dropbox

      - name: Test experimental Cloudflare access foundation
        run: npm run test:cf-access

      - name: Test experimental Cloudflare session primitives
        run: npm run test:cf-sessions

      - name: Test experimental Cloudflare user-management primitives
        run: npm run test:cf-users

      - name: Test experimental Cloudflare role management
        run: npm run test:cf-roles

      - name: Test experimental Cloudflare credential vault
        run: npm run test:cf-vault

      - name: Test experimental connected Google Drive isolation
        run: npm run test:cf-connected-drive

      - name: Test experimental Google OAuth flow
        run: npm run test:cf-google-oauth

      - name: Test experimental Google identity and login
        run: |
          npm run test:cf-identity
          npm run test:cf-login

      - name: Test isolated uptime monitor
        run: node tests/uptime_monitor_test.mjs

      - name: Test encrypted metadata backup and recovery
        run: |
          python3 -m venv "$RUNNER_TEMP/kova-backup-venv"
          "$RUNNER_TEMP/kova-backup-venv/bin/pip" install -r tools/backup/requirements.txt
          "$RUNNER_TEMP/kova-backup-venv/bin/python" tests/backup_test.py

      - name: Check native platform deployment configuration
        run: |
          python3 tests/platform_config_smoke.py
          python3 tests/native_entrypoint_smoke.py

      - name: Test documentation navigation and build bilingual docs
        run: |
          npm run test:docs
          npm run docs:build
          npm run test:docs-build
          GITHUB_REPOSITORY=ExampleOwner/ForkName DOCS_BASE=/ npm run docs:build
          GITHUB_REPOSITORY=ExampleOwner/ForkName DOCS_BASE=/ npm run test:docs-build

      - name: Test Go workspace UI
        run: npm run test:go-ui

      - name: Verify pinned skill library snapshots
        run: npm run test:skills

      - name: Set up Go for migration packages
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false

      - name: Test Go migration packages and race detector
        run: |
          go test ./...
          go test -race -tags sqlite_fts5 ./...
          make go-build
          ./build/alist-go version
          python3 tests/go_deployment_smoke.py

      - name: Build experimental Go Docker image
        run: docker build -f Dockerfile.golang -t kova-go-preview:ci .

      - name: Build and smoke-test native Docker image
        run: |
          set +e
          {
            docker build -t kova-native:ci . &&
            sh tests/native_docker_smoke.sh kova-native:ci
          } > /tmp/kova-docker-ci.log 2>&1
          status=$?
          tail -n 80 /tmp/kova-docker-ci.log
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              printf '::error::%s\n' "$line"
            done < <(tail -n 15 /tmp/kova-docker-ci.log)
          fi
          exit "$status"

      - name: Validate Cloudflare Worker bundle with Wrangler
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node ../../tests/cloudflare_isolated_config_test.mjs
          node ../../tests/cloudflare_access_workerd_test.mjs
          node ../../tests/cloudflare_sessions_workerd_test.mjs
          node ../../tests/cloudflare_user_management_workerd_test.mjs
          node ../../tests/cloudflare_role_management_workerd_test.mjs
          node ../../tests/cloudflare_credential_vault_workerd_test.mjs
          node ../../tests/cloudflare_r2_webdav_workerd_test.mjs
          node ../../tests/cloudflare_connected_drive_workerd_test.mjs
          node ../../tests/cloudflare_google_oauth_workerd_test.mjs
          node ../../tests/cloudflare_google_identity_workerd_test.mjs
          node ../../tests/cloudflare_google_login_workerd_test.mjs
          npx wrangler deploy --dry-run
          cd ../cloudflare-pages
          ../cloudflare-worker/node_modules/.bin/wrangler pages functions build functions --outdir /tmp/kova-pages-ci --compatibility-date 2026-11-16
          cd ../cloudflare-native
          ../cloudflare-worker/node_modules/.bin/wrangler deploy src/index.js --name kova-native-preview --compatibility-date 2026-11-16 --dry-run
        working-directory: deploy/cloudflare-worker

      - name: Install native C++20 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make cmake libsqlite3-dev libcurl4-openssl-dev libssl-dev zlib1g-dev

      - name: Build hardened LTO release binary & run test suite
        run: |
          set +e
          {
            make -j2 release &&
            ls -lh ./alist &&
            ./alist version &&
            "$RUNNER_TEMP/kova-backup-venv/bin/python" tests/backup_native_integration.py &&
            make -j2 test &&
            make -j2 go-compat-test &&
            make -j2 go-db-compat-test
          } > /tmp/kova-native-ci.log 2>&1
          status=$?
          tail -n 80 /tmp/kova-native-ci.log
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              printf '::error::%s\n' "$line"
            done < <(tail -n 9 /tmp/kova-native-ci.log)
          fi
          exit "$status"

      - name: Test official MCP Python SDK against local Kova
        run: |
          python3 -m venv "$RUNNER_TEMP/kova-mcp-venv"
          "$RUNNER_TEMP/kova-mcp-venv/bin/pip" install 'mcp==1.30.0'
          "$RUNNER_TEMP/kova-mcp-venv/bin/python" tests/mcp_sdk_integration.py ./alist

      - name: Test pinned NodeWarden WebDAV uploader against local Kova
        run: |
          mkdir -p /tmp/kova-nodewarden-source
          curl -fsSL https://codeload.github.com/shuaiplus/NodeWarden/tar.gz/954bd05c10535e5828e43103caa821514c333f7c -o /tmp/kova-nodewarden.tar.gz
          tar -xzf /tmp/kova-nodewarden.tar.gz -C /tmp/kova-nodewarden-source --strip-components=1
          deploy/cloudflare-worker/node_modules/.bin/esbuild /tmp/kova-nodewarden-source/src/services/backup-uploader.ts --bundle --platform=node --format=esm --outfile=/tmp/kova-nodewarden-uploader.mjs
          NODEWARDEN_UPLOADER=/tmp/kova-nodewarden-uploader.mjs node tests/nodewarden_webdav_integration.mjs

      - name: Run AddressSanitizer + LeakSanitizer + UBSan suite
        run: make -j2 asan

      - name: Run ThreadSanitizer concurrency suite
        run: make -j2 tsan

      - name: Run performance & memory benchmarks
        run: make -j2 bench
